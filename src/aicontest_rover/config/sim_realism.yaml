# sim_realistic.launch.xml で入れる「現実の誤差」(実機で測ったら値を合わせる)
/**:
  ros__parameters:
    # 滑り: 指令した機体の速度のうち、実際に効く割合
    slip_efficiency_x: 0.97      # 前後
    slip_efficiency_y: 0.35      # 横(実機で手で動かしたとき横滑りがかなり大きかったので 0.70 → 0.35 にした)
    slip_efficiency_yaw: 0.92    # 旋回
    slip_fluctuation: 0.05       # 効きのゆらぎ(標準偏差、割合)
    cross_drift: 0.05            # 前後に進むときに横へ流れる割合(標準偏差)

    # 計測輪
    odom_scale_error: [0.015, -0.01, 0.02]   # 半径の誤差(左・右・横)。+1.5% なら 1m 進むと 1.5cm 多く数える
    odom_noise_rad_s: 0.05                   # 角速度のノイズ(標準偏差)
    odom_skip_per_sec: 0.3                   # 1秒あたりに計測輪が一瞬空転する回数
    odom_skip_duration: 0.08                 # 空転の長さ [s]

    # LiDAR(RPLIDAR A1)
    lidar_noise_m: 0.01          # 距離のノイズ(標準偏差、シミュレーター自体の ±1cm に追加)
    lidar_dropout: 0.03          # 取りこぼす点の割合
    lidar_range_min: 0.15        # これより近い点は測れない

    # IMU(ジャイロの z 軸)
    gyro_bias_deg_s: 0.5           # 最初のずれ(校正前)。安い MEMS で 0.1〜1°/s 程度
    gyro_bias_walk_deg_s: 0.02     # ずれが 1秒あたり変わる量
    gyro_noise_deg_s: 0.3          # 1サンプル(約100Hz)のノイズ
    gyro_scale_error: 0.005        # 倍率の誤差

    seed: 0                      # 0 なら毎回ちがう乱数
