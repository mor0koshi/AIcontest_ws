# 実機用の自己位置推定設定
# wheel_odometry は launch で chassis 設定 → この設定 の順に読み込むので、
# ここで wheel_odometry にだけ計測輪3つを上書きする(chassis_calculator はメカナムのまま)
/**:
  ros__parameters:
    use_odom_tf: false
    frequency: 50.0
    map_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    num_particles: 300
    initial_pose_x: 0.5
    initial_pose_y: 0.5
    initial_pose_yaw_deg: 0.0
    motion_noise_xx: 0.2
    motion_noise_xy: 0.05
    motion_noise_yy: 0.2
    motion_noise_yaw_deg: 1.0
    normal_noise_position: 0.003
    normal_noise_orientation_deg: 0.1
    expansion_radius_position: 0.1
    expansion_radius_orientation_deg: 30.0
    laser_likelihood_max_dist: 0.3
    transform_tolerance: 0.0

/**/wheel_odometry:
  ros__parameters:
    chassis_type: "omni"
    wheel_radius: 0.024   # 計測輪の実際の半径(直径48mm)
    wheel_names: ["odom_wheel_l", "odom_wheel_r", "odom_wheel_s"]
    wheel_base_names: ["odom_wheel_l_base", "odom_wheel_r_base", "odom_wheel_s_base"]
