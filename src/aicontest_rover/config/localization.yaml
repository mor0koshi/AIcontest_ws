# シミュレーション用の自己位置推定設定
# オドメトリは駆動輪(メカナム)から計算する(シミュレーターは計測輪を再現しないため)
# 実機では localization_real.yaml を使う
/**:
  ros__parameters:
    use_odom_tf: false
    frequency: 50.0
    map_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    num_particles: 300
    initial_pose_x: 0.5
    initial_pose_y: 0.5
    initial_pose_yaw_deg: 0.0
    motion_noise_xx: 0.2
    motion_noise_xy: 0.05
    motion_noise_yy: 0.2
    motion_noise_yaw_deg: 1.0
    normal_noise_position: 0.003
    normal_noise_orientation_deg: 0.1
    expansion_radius_position: 0.1
    expansion_radius_orientation_deg: 30.0
    laser_likelihood_max_dist: 0.3
    transform_tolerance: 0.0
