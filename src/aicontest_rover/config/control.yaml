# 経路追従(holonomic pure pursuit)と speed path 追従
# M2006 + メカナム直径60mm の最高速度は約1.5m/s。最初は控えめにしている
/**:
  ros__parameters:
    frequency: 50.0
    lookahead_time_s: 0.5
    min_lookahead_distance_m: 0.1
    max_lookahead_distance_m: 0.5
    yaw_speed_p: 2.0
    curvature_deceleration_p: 0.5
    min_curvature_speed_m_s: 0.15
    yaw_deceleration_p: 1.0
    max_speed_xy_m_s: 0.3     # 0.5 だと自己位置の遅れで椅子の脚に触れることがあった(シミュレーション)
    min_speed_xy_m_s: 0.05
    max_speed_yaw_deg_s: 120.0
    min_speed_yaw_deg_s: 5.0
    max_acceleration_xy_m_s2: 1.5
    max_acceleration_yaw_deg_s2: 360.0
    goal_deceleration_m_s2: 1.5
    goal_deceleration_distance_p: 1.5
    goal_position_tolerance_m: 0.02   # 3cm だと椅子の入口に横にずれたまま着いて、斜めに通り抜けることがあった
    goal_yaw_tolerance_deg: 2.0
    goal_speed_tolerance_xy_m_s: 0.1
    goal_speed_tolerance_yaw_deg_s: 10.0
