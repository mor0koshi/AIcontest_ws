# natto_simple_simulation 用。初期位置は config/localization.yaml と合わせる
/**:
  ros__parameters:
    initial_pose_x: 0.5
    initial_pose_y: 0.5
    initial_pose_yaw_deg: 0.0
    frequency: 100.0
    joint_names: ["mecanum_fl", "mecanum_fr", "mecanum_rl", "mecanum_rr"]
    control_modes: ["speed", "speed", "speed", "speed"]
    initial_positions: [0.0, 0.0, 0.0, 0.0]
    joint_position_tau: [0.1, 0.1, 0.1, 0.1]
    joint_velocity_tau: [0.05, 0.05, 0.05, 0.05]
    joint_velocity_max: [52.0, 52.0, 52.0, 52.0]   # M2006 出力軸 約500rpm
