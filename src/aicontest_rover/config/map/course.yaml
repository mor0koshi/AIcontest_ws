# コースの配置と回る順番。毎回ランダムに変わるものはここだけ書き換えて、
#   ros2 run aicontest_rover make_map.py
# で 地図(line_segments.csv / circles.csv)と ルート(state_graph/course.md)を作り直す。
# 座標は地図の左下が原点、x 0〜5m、y 0〜4m。角度は度(x軸正方向が0、反時計回りが正)。

field:
  width: 5.0          # x方向 [m]
  height: 4.0         # y方向 [m]
  wall_height: 0.3    # 壁の高さ [m](LiDARの高さより高ければよい)

start: {x: 0.5, y: 0.5, yaw: 0}           # スタート位置(シミュレーションの初期位置と合わせる)
goal: {x: 2.15, y: 2.0, yaw: 0}           # 最後に止まる位置(コーンの手前)

# ゴールのコーン(LiDARに映る実物)。半径はLiDARの高さでの太さ(仮)
cone: {x: 2.5, y: 2.0, radius: 0.10}

# クレーター(黒い床、直径42cm)。床なのでLiDARには映らない
crater_radius: 0.21
crater_margin: 0.06      # 地図にはこれだけ大きく描く(触れると -2点。測定誤差・自己位置の誤差の分の余白)
craters:
  - [1.5, 2.9]
  - [3.6, 1.1]

# サンプル採取ポイントの椅子(四つ足)
chair:
  inner_x: 0.31       # 脚の内側の間隔 [m](椅子の向きの前後)
  inner_y: 0.31       # 脚の内側の間隔 [m](椅子の向きの左右)
  leg_size: 0.02      # 脚の太さ [m](仮)

# 椅子の下を通り抜けるときの、入口・出口と椅子の中心との距離 [m]
# (椅子の外側 0.175 + ロボットの奥行きの半分 0.09 + 余裕)
pass_distance: 0.35
# 椅子の中はロボットの前後方向だけで進む(メカナムは真横に滑りやすい)。
# 入口でロボットの向きを通り抜ける向きにそろえる。true なら、回転が少なくて済むときは後ろ向きで突入する
allow_backward: true
# 入口で止まる時間 [s]。止まっている間に自己位置が正確になってから突入する(0 なら止まらない)
entry_wait_sec: 1.5

# 走り方
#   forward   … 移動の前にその場で進む向きを向いてから前進(後退)する。横には動かない(横滑り対策、既定)
#   holonomic … 向きを変えながら斜め・横にも動く(メカナムの本来の動き。横滑りが小さい床なら速い)
drive_mode: forward
turn_penalty: 0.1       # forward で止まって回るたびに足すコスト [m 相当]

# true にすると、回る順番と通り抜ける向きを自動で決める(下の chairs の順番と pass は無視)
#   コスト = 移動距離(横向きに進む分は lateral_weight 倍重い)+ rotation_weight × 回転角
auto_route: false
lateral_weight: 1.5     # メカナムの横移動を嫌う度合い
rotation_weight: 0.25   # 1 rad 回る手間を何 m 進む手間とみなすか
clearance_margin: 0.03  # 入口・出口・途中の点と壁・クレーター・ほかの椅子とのすき間の最小 [m]
travel_margin: 0.05     # 椅子の間を動くときの直線・回る点と椅子とのすき間(自己位置の誤差 3〜5cm の分) [m]

# 回る順番に並べる(auto_route: false のとき)。pass = 椅子の下を通り抜ける向き(0:+x 90:+y 180:-x 270:-y)。
# 椅子の脚の間をまっすぐ抜けるように、椅子の向き yaw と 0/90/180/270 度ずれた向きにする
# force_pass: <角度> を付けると、auto_route: true でもその椅子だけ通り抜ける向きを決められる(test_routes.py で問題が出たとき)
chairs:
  - {x: 1.2, y: 1.0, yaw: 0, pass: 0}
  - {x: 2.4, y: 0.7, yaw: 0, pass: 0}
  - {x: 4.3, y: 0.6, yaw: 0, pass: 0}
  - {x: 4.2, y: 2.0, yaw: 0, pass: 90}
  - {x: 4.2, y: 3.3, yaw: 0, pass: 180}
  - {x: 2.9, y: 3.3, yaw: 0, pass: 180}
  - {x: 1.0, y: 3.4, yaw: 0, pass: 180}
  - {x: 0.8, y: 2.2, yaw: 0, pass: 270}
