# aicontest_can_bridge の設定(docs/can_protocol.md v0.3)
/**:
  ros__parameters:
    can_interface: "can0"          # PC でのテストは vcan0
    # 0x300 / 0x310 の車輪0〜3 の並び(Nucleo 側で C610 ID1〜4 に対応させる)
    drive_wheel_names: ["mecanum_fl", "mecanum_fr", "mecanum_rl", "mecanum_rr"]
    # 0x311(前後向き)/ 0x312(横向き)の並び
    odom_wheel_names: ["odom_wheel_l", "odom_wheel_s"]
    # 回転方向が逆の車輪は -1.0 にする(ファームウェアを書き直さずに直せる)
    drive_wheel_directions: [1.0, 1.0, 1.0, 1.0]
    odom_wheel_directions: [1.0, 1.0]
    # 計測輪1回転あたりのカウント(エンコーダのPPR × 4)。position(デバッグ用)にだけ使う
    odom_counts_per_rev: [1440.0, 1440.0]  # E6B2-CWZ6C 360 P/R × 4
    # 0x313 IMU(BMX055)。左に回して /imu の angular_velocity.z が正にならなければ -1.0
    imu_sign: 1.0
    imu_frame_id: "base_link"
    command_timeout_sec: 0.5       # 指令がこれ以上来なければ 0 を送る
    tx_rate_hz: 100.0
    stats_period_sec: 10.0         # 受信・送信の統計をログに出す間隔(0 で出さない)
